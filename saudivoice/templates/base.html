<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#073f2b">
  <title>{% block title %}البوت السعودي{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
  <div class="site-shell">
    {% block header %}
      <header class="site-header">
        <a class="site-brand" href="/">البوت السعودي</a>
        <a class="back-link" href="/?step=mode">تغيير التجربة</a>
      </header>
    {% endblock %}

    <main class="page-stage {% block stage_class %}{% endblock %}">
      {% block content %}{% endblock %}
    </main>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
